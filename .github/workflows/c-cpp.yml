name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    - name: build
      run: cmake --build build --config Release
    - name: test
      run: ctest --test-dir build -C Release --output-on-failure
